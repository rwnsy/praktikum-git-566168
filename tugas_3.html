<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Animation & Transition</title>

    <style>
      :root {
        --primary: #0e7c7b;
        --secondary: #7c3aed;
        --accent: #ea580c;
        --bg: #f5f5f5;
        --white: #ffffff;
      }

      body {
        font-family: Arial;
        background: var(--bg);
        text-align: center;
        padding: 40px;
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .fade-box {
        animation: fade 1s;
        background: var(--white);
        padding: 20px;
        margin-bottom: 30px;
      }

      button {
        padding: 10px 20px;
        border: none;
        margin: 10px;
        color: white;
        cursor: pointer;
      }

      .btn1 {
        background: var(--primary);
        transition: background 0.3s;
      }
      .btn1:hover {
        background: #095e5d;
      }

      .btn2 {
        background: var(--secondary);
        transition: transform 0.3s;
      }
      .btn2:hover {
        transform: scale(1.2);
      }

      .btn3 {
        background: var(--accent);
        transition: box-shadow 0.3s;
      }
      .btn3:hover {
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      }

      .spinner-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 5px solid #ddd;
        border-top: 5px solid var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.4);
        }
        100% {
          transform: scale(1);
        }
      }

      .spinner2 {
        width: 40px;
        height: 40px;
        background: var(--secondary);
        border-radius: 50%;
        animation: pulse 1s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 5px;
      }

      .dot {
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 50%;
        animation: bounce 1s infinite;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      /* BONUS FLIP CARD */
      .card {
        width: 150px;
        height: 200px;
        margin: auto;
        perspective: 800px;
      }

      .inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }

      .card:hover .inner {
        transform: rotateY(180deg);
      }

      .front,
      .back {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
        background: white;
        border: 1px solid #ccc;
      }

      .back {
        transform: rotateY(180deg);
        background: var(--primary);
        color: white;
      }
    </style>
  </head>

  <body>
    <h2 class="fade-box">Animation & Transition</h2>

    <button class="btn1">Hover Warna</button>
    <button class="btn2">Hover Scale</button>
    <button class="btn3">Hover Shadow</button>

    <h3>Loading Spinner</h3>

    <div class="spinner-row">
      <div class="spinner"></div>
      <div class="spinner2"></div>

      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <h3>Flip Card</h3>
    <div class="card">
      <div class="inner">
        <div class="front">Depan</div>
        <div class="back">Belakang</div>
      </div>
    </div>
  </body>
</html>
